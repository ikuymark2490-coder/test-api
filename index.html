<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทดสอบ Gemini API (Hardcoded)</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f0f2f5; }
  #chatBox { height: 400px; background: white; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #ccc; }
  .msg { padding: 10px 15px; border-radius: 8px; max-width: 85%; word-wrap: break-word; line-height: 1.5; }
  .msg.user { background: #4f46e5; color: white; align-self: flex-end; }
  .msg.ai { background: #e0e7ff; color: black; align-self: flex-start; }
  .msg.error { background: #fee2e2; color: #b91c1c; align-self: center; font-size: 14px; width: 95%; text-align: center; }
  .input-area { display: flex; gap: 5px; }
  input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
  button { padding: 12px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<h2 style="text-align: center;">ทดสอบ API แบบฝังโค้ด</h2>
<p style="text-align: center; font-size: 12px; color: red;"><b>(ฝัง API Key ในโค้ดบรรทัดที่ 31)</b></p>

<div id="chatBox">
  <div class="msg ai">ระบบพร้อมแล้ว! ลองพิมพ์คุยกับผมดูครับ</div>
</div>

<div class="input-area">
  <input type="text" id="message" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key === 'Enter') sendMessage()">
  <button onclick="sendMessage()">ส่ง</button>
</div>

<script>
  // 🔥🔥🔥 เอา API KEY ของคุณมาวางในเครื่องหมายคำพูดข้างล่างนี้ 🔥🔥🔥
  const MY_API_KEY = "AIzaSyCZt6ComrXdbERbgYnx_VpfypyYxR0-1vQ"; 
  // ☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️☝️

  async function sendMessage() {
    const msgInput = document.getElementById('message');
    const msg = msgInput.value.trim();
    const chatBox = document.getElementById('chatBox');

    if (!msg) return;
    if (MY_API_KEY === "ใส่คีย์ของคุณตรงนี้" || MY_API_KEY === "") {
        alert("⚠️ คุณยังไม่ได้เอา API Key ไปฝังในโค้ดครับ!");
        return;
    }

    // แปะข้อความผู้ใช้
    chatBox.innerHTML += `<div class="msg user">${msg}</div>`;
    msgInput.value = '';
    chatBox.innerHTML += `<div class="msg ai" id="loading">กำลังคิด...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      // เรียกใช้ Gemini 1.5 Flash (URL มาตรฐานที่สุดของ Google)
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: msg }] }]
        })
      });

      const data = await response.json();
      document.getElementById('loading').remove();

      if (data.error) {
        chatBox.innerHTML += `<div class="msg error"><b>❌ พังจ้า! (Error จาก Google)</b><br>สาเหตุ: ${data.error.message}<br><i>Status: ${data.error.status}</i></div>`;
      } else {
        const aiText = data.candidates[0].content.parts[0].text;
        chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
      }
    } catch (error) {
      document.getElementById('loading').remove();
      chatBox.innerHTML += `<div class="msg error">เชื่อมต่อเน็ตเวิร์กไม่สำเร็จ: ${error.message}</div>`;
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
